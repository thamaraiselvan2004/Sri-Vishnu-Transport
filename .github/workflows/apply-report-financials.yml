name: Apply Report Financial Enhancements

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-build:
    if: ${{ !startsWith(github.event.head_commit.message, 'Apply monthly business summary') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply monthly business summary
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/components/HomePage.tsx')
          s = p.read_text()

          old = '''  // Quick total revenue and total profit calculations
  const totalRevenue = trips.reduce((sum, t) => sum + (t.trip_fare || 0), 0);
  const totalTripProfit = trips.reduce((sum, t) => sum + (t.net_profit || 0), 0);
  const totalMaintenanceExpense = maintenance.reduce(
    (sum, m) => sum + (m.amount || 0),
    0
  );
  const totalHalting = trips.reduce(
    (sum, t) => sum + (Number(t.loading_halting_fare) || 0) + (Number(t.unloading_halting_fare) || 0),
    0
  );
  const finalProfit = totalTripProfit - totalMaintenanceExpense + totalHalting;
'''

          new = '''  // Current-month business summary. Historical records remain untouched.
  const now = new Date();
  const currentMonthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
  const currentMonthLabel = now.toLocaleDateString("en-IN", { month: "long", year: "numeric" });

  const getMonthKey = (value?: string) => {
    if (!value) return "";
    const match = String(value).match(/^(\\d{4})-(\\d{2})/);
    if (match) return `${match[1]}-${match[2]}`;
    const parsed = new Date(value);
    return Number.isNaN(parsed.getTime())
      ? ""
      : `${parsed.getFullYear()}-${String(parsed.getMonth() + 1).padStart(2, "0")}`;
  };

  const currentMonthTrips = trips.filter((t) => getMonthKey(t.trip_date) === currentMonthKey);
  const currentMonthMaintenance = maintenance.filter(
    (m) => getMonthKey(m.maintenance_date) === currentMonthKey
  );
  const totalRevenue = currentMonthTrips.reduce((sum, t) => sum + (Number(t.trip_fare) || 0), 0);
  const totalTripProfit = currentMonthTrips.reduce((sum, t) => sum + (Number(t.net_profit) || 0), 0);
  const totalMaintenanceExpense = currentMonthMaintenance.reduce(
    (sum, m) => sum + (Number(m.amount) || 0),
    0
  );
  const totalHalting = currentMonthTrips.reduce(
    (sum, t) => sum + (Number(t.loading_halting_fare) || 0) + (Number(t.unloading_halting_fare) || 0),
    0
  );
  const finalProfit = totalTripProfit - totalMaintenanceExpense + totalHalting;

  const monthlySummary = new Map<string, { trips: number; revenue: number; profit: number }>();
  for (const trip of trips) {
    const month = getMonthKey(trip.trip_date);
    if (!month) continue;
    const entry = monthlySummary.get(month) || { trips: 0, revenue: 0, profit: 0 };
    entry.trips += 1;
    entry.revenue += Number(trip.trip_fare) || 0;
    entry.profit += Number(trip.net_profit) || 0;
    entry.profit += (Number(trip.loading_halting_fare) || 0) + (Number(trip.unloading_halting_fare) || 0);
    monthlySummary.set(month, entry);
  }
  for (const record of maintenance) {
    const month = getMonthKey(record.maintenance_date);
    if (!month) continue;
    const entry = monthlySummary.get(month) || { trips: 0, revenue: 0, profit: 0 };
    entry.profit -= Number(record.amount) || 0;
    monthlySummary.set(month, entry);
  }
  const monthlyReports = Array.from(monthlySummary.entries()).sort(([a], [b]) => b.localeCompare(a));
'''

          if old not in s:
              raise SystemExit('Expected HomePage KPI block was not found')
          s = s.replace(old, new, 1)

          old_trips = '''{trips.length}
          </div>
          <div className="text-xs text-slate-500 mt-1">
            Digitally logged trips'''
          new_trips = '''{currentMonthTrips.length}
          </div>
          <div className="text-xs text-slate-500 mt-1">
            {currentMonthLabel}'''
          if old_trips not in s:
              raise SystemExit('Expected Total Trips KPI block was not found')
          s = s.replace(old_trips, new_trips, 1)

          old_revenue = '''{formatINR(totalRevenue)}
          </div>
          <div className="text-xs text-slate-500 mt-1">Gross freight fare'''
          new_revenue = '''{formatINR(totalRevenue)}
          </div>
          <div className="text-xs text-slate-500 mt-1">{currentMonthLabel}'''
          if old_revenue not in s:
              raise SystemExit('Expected Total Revenue KPI block was not found')
          s = s.replace(old_revenue, new_revenue, 1)

          marker = '''      {/* Vehicle Quick Selector & Recent Trips */}
'''
          report = '''      {/* Monthly Business Report */}
      <section className="mb-10 bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
        <div className="p-6 border-b border-slate-200 bg-slate-50/70">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
            <div>
              <h2 className="text-lg font-bold text-slate-900">Monthly Business Report</h2>
              <p className="text-xs text-slate-500 mt-1">Monthly totals are calculated from the existing trip and maintenance records.</p>
            </div>
            <div className="text-xs font-semibold text-blue-700 bg-blue-50 border border-blue-200 rounded-lg px-3 py-1.5">Current: {currentMonthLabel}</div>
          </div>
        </div>
        <div className="overflow-x-auto">
          <table className="w-full min-w-[640px] text-sm">
            <thead className="bg-slate-100/80 text-xs uppercase tracking-wide text-slate-500">
              <tr>
                <th className="text-left px-6 py-3 font-bold">Month</th>
                <th className="text-right px-6 py-3 font-bold">Total Trips</th>
                <th className="text-right px-6 py-3 font-bold">Total Revenue</th>
                <th className="text-right px-6 py-3 font-bold">Net Profit</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-slate-100">
              {monthlyReports.length === 0 ? (
                <tr><td colSpan={4} className="px-6 py-8 text-center text-slate-500">No monthly business data yet.</td></tr>
              ) : monthlyReports.map(([month, report]) => {
                const [year, monthNumber] = month.split("-").map(Number);
                const label = new Date(year, monthNumber - 1, 1).toLocaleDateString("en-IN", { month: "long", year: "numeric" });
                const isCurrent = month === currentMonthKey;
                return (
                  <tr key={month} className={isCurrent ? "bg-blue-50/50" : "bg-white"}>
                    <td className="px-6 py-4 font-bold text-slate-800">
                      <div className="flex items-center gap-2">
                        <span>{label}</span>
                        {isCurrent && <span className="text-[10px] font-bold uppercase tracking-wide px-2 py-0.5 rounded-full bg-blue-100 text-blue-700">Current</span>}
                      </div>
                    </td>
                    <td className="px-6 py-4 text-right font-semibold text-slate-700">{report.trips}</td>
                    <td className="px-6 py-4 text-right font-semibold text-blue-700 font-mono">{formatINR(report.revenue)}</td>
                    <td className="px-6 py-4 text-right font-bold text-emerald-700 font-mono">{formatINR(report.profit)}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </section>

'''
          if marker not in s:
              raise SystemExit('Monthly report insertion marker was not found')
          s = s.replace(marker, report + marker, 1)
          p.write_text(s)

          Path('.github/workflows/apply-report-financials.yml').unlink()
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/HomePage.tsx .github/workflows/apply-report-financials.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Apply monthly business summary'
          git push
