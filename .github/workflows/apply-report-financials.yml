name: Apply Report Financial Enhancements

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply report financial patch
        run: python scripts/patch_report_financials.py

      - name: Install dependencies
        run: npm install

      - name: Build application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Commit patched source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/types.ts src/lib/calculations.ts src/components/VehicleReportPage.tsx src/components/DriverReportPage.tsx scripts/patch_report_financials.py
          git diff --cached --quiet && echo 'No source changes to commit' || git commit -m 'Enhance vehicle and driver financial reports'
          git push
