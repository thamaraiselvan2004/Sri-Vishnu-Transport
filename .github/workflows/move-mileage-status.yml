name: Move Mileage Status Below Service Maintenance

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  move-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Move Mileage Status card
        shell: python
        run: |
          from pathlib import Path
          app = Path('src/App.tsx')
          home = Path('src/components/HomePage.tsx')
          s = app.read_text()
          block = '''                <MileageStatusHomeCard\n                  onNavigate={() => {\n                    setCurrentTab("mileage-status");\n                    window.scrollTo({ top: 0, behavior: "smooth" });\n                  }}\n                />\n'''
          if block in s:
            s = s.replace(block, '', 1)
            s = s.replace('import { MileageStatusHomeCard } from "./components/MileageStatusHomeCard";\n', '')
          app.write_text(s)
          h = home.read_text()
          if 'import { MileageStatusHomeCard } from "./MileageStatusHomeCard";' not in h:
            h = h.replace('import { TripDetailsModal } from "./TripDetailsModal";\n', 'import { TripDetailsModal } from "./TripDetailsModal";\nimport { MileageStatusHomeCard } from "./MileageStatusHomeCard";\n', 1)
          marker = '''        </div>\n      </div>\n\n      {/* Quick Business KPI Summary */}'''
          replacement = '''        </div>\n\n        <div className="md:col-start-3 mt-5">\n          <MileageStatusHomeCard\n            onNavigate={() => onNavigate("mileage-status")}\n          />\n        </div>\n      </div>\n\n      {/* Quick Business KPI Summary */}'''
          if marker not in h:
            raise SystemExit('Quick Actions marker not found')
          h = h.replace(marker, replacement, 1)
          home.write_text(h)

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install
      - name: Build Vite app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npx vite build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload dist
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit source changes and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/move-mileage-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/HomePage.tsx .github/workflows/move-mileage-status.yml
          git commit -m "Move Mileage Status below Service Maintenance"
          git push
