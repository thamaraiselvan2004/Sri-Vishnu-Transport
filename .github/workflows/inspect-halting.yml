name: Inspect Halting UI
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print halting-related source
        shell: bash
        run: |
          echo '--- AddTripPage halting matches ---'
          grep -n -B 12 -A 35 -E 'haltingDays|Halting|haltingCharge' src/components/AddTripPage.tsx || true
          echo '--- DriverReportPage halting matches ---'
          grep -n -B 12 -A 35 -E 'overallHaltingDays|Halting Days|halting_days' src/components/DriverReportPage.tsx || true
          echo '--- EditTripModal halting matches ---'
          grep -n -B 12 -A 35 -E 'haltingDays|Halting|haltingCharge' src/components/EditTripModal.tsx || true
