name: Restore Driver Report

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Driver Report from pre-financial-edit version
        run: |
          curl -fsSL "https://raw.githubusercontent.com/thamaraiselvan2004/Sri-Vishnu-Transport/15aa787e02e15bad082888ca000b73ec6f4c43d4/src/components/DriverReportPage.tsx" -o src/components/DriverReportPage.tsx
          test -s src/components/DriverReportPage.tsx

      - name: Install dependencies
        run: npm install

      - name: Build application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Commit restored Driver Report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/DriverReportPage.tsx
          git diff --cached --quiet && echo 'No changes needed' || git commit -m 'Restore Driver Report to original pre-financial version'
          git push
