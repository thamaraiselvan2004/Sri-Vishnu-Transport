name: Restore Driver Report Dependencies

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  restore:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Restore Driver Report dependencies from pre-financial version')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Driver Report and its calculation/type dependencies
        run: |
          git checkout 15aa787e02e15bad082888ca000b73ec6f4c43d4 -- src/components/DriverReportPage.tsx src/lib/calculations.ts src/types.ts
          test -s src/components/DriverReportPage.tsx
          test -s src/lib/calculations.ts
          test -s src/types.ts

      - name: Install dependencies
        run: npm install

      - name: Build application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Commit recovered Driver Report files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/DriverReportPage.tsx src/lib/calculations.ts src/types.ts
          git diff --cached --quiet && echo 'No changes needed' || git commit -m 'Restore Driver Report dependencies from pre-financial version'
          git push
