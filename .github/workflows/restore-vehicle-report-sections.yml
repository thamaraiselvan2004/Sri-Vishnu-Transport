name: Restore Original Vehicle Report Sections

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Restore original Vehicle Report sections'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Restore original Vehicle Report source
        run: |
          git fetch origin 15aa787e02e15bad082888ca000b73ec6f4c43d4 --depth=1
          git checkout 15aa787e02e15bad082888ca000b73ec6f4c43d4 -- src/components/VehicleReportPage.tsx
      - name: Add only the requested halting snapshot metrics
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/VehicleReportPage.tsx')
          s = p.read_text()
          calc_anchor = '''  const insights = useMemo(() => {'''
          calc_insert = '''  const totalHaltingDays = useMemo(() => vehicleTrips.reduce((total, trip) => {\n    const separate = trip.loading_halting_days !== undefined || trip.unloading_halting_days !== undefined;\n    return total + (separate ? (Number(trip.loading_halting_days) || 0) + (Number(trip.unloading_halting_days) || 0) : (Number(trip.halting_days) || 0));\n  }, 0), [vehicleTrips]);\n\n  const totalHaltingCharges = useMemo(() => vehicleTrips.reduce((total, trip) => {\n    const separate = trip.loading_halting_fare !== undefined || trip.unloading_halting_fare !== undefined;\n    return total + (separate ? (Number(trip.loading_halting_fare) || 0) + (Number(trip.unloading_halting_fare) || 0) : (Number(trip.halting_fare) || 0));\n  }, 0), [vehicleTrips]);\n\n  const overallProfit = stats.finalVehicleProfit + totalHaltingCharges;\n\n'''
          if calc_anchor not in s:
              raise SystemExit('calculation anchor not found')
          s = s.replace(calc_anchor, calc_insert + calc_anchor, 1)
          card_anchor = '''          {/* Card 9: Service Maintenance */}'''
          # Insert immediately after the complete Card 9 block, using its unique ending.
          end_anchor = '''            </div>\n          </div>\n        </div>\n      </div>\n\n      {/* Tabs Navigation for Report Sections */}'''
          cards = '''      {/* Additional requested halting metrics */}\n      <div className="grid grid-cols-2 lg:grid-cols-3 gap-4 mt-4">\n        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs">\n          <div className="text-xs font-bold text-slate-500 uppercase tracking-wide flex items-center gap-1">\n            <Clock className="w-3.5 h-3.5 text-violet-600" /> Total Halting Days\n          </div>\n          <div className="text-2xl sm:text-3xl font-black font-mono text-violet-700 mt-1">{totalHaltingDays} Days</div>\n          <div className="text-xs text-slate-500 mt-1">Loading + Unloading halting</div>\n        </div>\n        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs">\n          <div className="text-xs font-bold text-slate-500 uppercase tracking-wide flex items-center gap-1">\n            <IndianRupee className="w-3.5 h-3.5 text-rose-600" /> Total Halting Charges\n          </div>\n          <div className="text-2xl sm:text-3xl font-black font-mono text-rose-700 mt-1">{formatINR(totalHaltingCharges)}</div>\n          <div className="text-xs text-slate-500 mt-1">Total loading + unloading halting</div>\n        </div>\n        <div className="bg-white p-5 rounded-2xl border-2 border-violet-500/80 bg-violet-50/20">\n          <div className="text-xs font-bold text-violet-800 uppercase tracking-wide">Overall Profit</div>\n          <div className={`text-2xl sm:text-3xl font-black font-mono mt-1 ${overallProfit >= 0 ? "text-violet-700" : "text-red-700"}`}>{formatINR(overallProfit)}</div>\n          <div className="text-xs text-violet-700 font-semibold mt-1">Final Net Profit + Total Halting Charges</div>\n        </div>\n      </div>\n\n'''
          if end_anchor not in s:
              raise SystemExit('snapshot ending anchor not found')
          s = s.replace(end_anchor, end_anchor.replace('      {/* Tabs Navigation for Report Sections */}', cards + '      {/* Tabs Navigation for Report Sections */}'), 1)
          p.write_text(s)
          print('Original Vehicle Report restored; requested halting metrics added.')
          PY
      - name: Build verification
        run: |
          npm install
          npx vite build
      - name: Commit restored source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/VehicleReportPage.tsx
          git diff --cached --quiet && echo 'No source change needed.' || git commit -m 'Restore original Vehicle Report sections'
          git push
