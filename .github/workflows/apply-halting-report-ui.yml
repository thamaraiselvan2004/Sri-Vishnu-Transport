name: Apply Halting Report UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch halting UI and driver report
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # ---------- EditTripModal ----------
          p = Path('src/components/EditTripModal.tsx')
          s = p.read_text()
          if 'loadingHaltingDays' not in s:
              s = s.replace('  const [haltingDays, setHaltingDays] = useState("");\n  const [haltingChargePerDay, setHaltingChargePerDay] = useState("");',
                  '  const [haltingDays, setHaltingDays] = useState("");\n  const [haltingChargePerDay, setHaltingChargePerDay] = useState("");\n  const [loadingHaltingDays, setLoadingHaltingDays] = useState("");\n  const [loadingHaltingChargePerDay, setLoadingHaltingChargePerDay] = useState("");\n  const [unloadingHaltingDays, setUnloadingHaltingDays] = useState("");\n  const [unloadingHaltingChargePerDay, setUnloadingHaltingChargePerDay] = useState("");')
              s = s.replace('    setHaltingDays(String(trip.halting_days ?? "0"));\n    setHaltingChargePerDay(String(trip.halting_charge_per_day ?? "0"));',
                  '    setHaltingDays(String(trip.halting_days ?? "0"));\n    setHaltingChargePerDay(String(trip.halting_charge_per_day ?? "0"));\n    setLoadingHaltingDays(String(trip.loading_halting_days ?? "0"));\n    setLoadingHaltingChargePerDay(String(trip.loading_halting_charge_per_day ?? "0"));\n    setUnloadingHaltingDays(String(trip.unloading_halting_days ?? "0"));\n    setUnloadingHaltingChargePerDay(String(trip.unloading_halting_charge_per_day ?? "0"));')
              s = s.replace('  const haltingFare = numberValue(haltingDays) * numberValue(haltingChargePerDay);',
                  '  const loadingHaltingFare = numberValue(loadingHaltingDays) * numberValue(loadingHaltingChargePerDay);\n  const unloadingHaltingFare = numberValue(unloadingHaltingDays) * numberValue(unloadingHaltingChargePerDay);\n  const haltingFare = loadingHaltingFare + unloadingHaltingFare;')
              s = s.replace('        halting_days: numberValue(haltingDays),\n        halting_charge_per_day: numberValue(haltingChargePerDay),\n        halting_fare: haltingFare,',
                  '        halting_days: numberValue(loadingHaltingDays) + numberValue(unloadingHaltingDays),\n        halting_charge_per_day: haltingFare > 0 ? haltingFare / Math.max(0.01, numberValue(loadingHaltingDays) + numberValue(unloadingHaltingDays)) : 0,\n        halting_fare: haltingFare,\n        loading_halting_days: numberValue(loadingHaltingDays),\n        loading_halting_charge_per_day: numberValue(loadingHaltingChargePerDay),\n        loading_halting_fare: loadingHaltingFare,\n        unloading_halting_days: numberValue(unloadingHaltingDays),\n        unloading_halting_charge_per_day: numberValue(unloadingHaltingChargePerDay),\n        unloading_halting_fare: unloadingHaltingFare,')
              old = '''          <section>\n            <h3 className="mb-3 text-sm font-bold uppercase tracking-wide text-slate-500">Halting</h3>\n            <div className="grid grid-cols-1 gap-4 md:grid-cols-3">\n              <label><span className={labelClass}>Halting Days</span><input type="number" min="0" className={inputClass} value={haltingDays} onChange={e => setHaltingDays(e.target.value)} /></label>\n              <label><span className={labelClass}>Charge Per Day</span><input type="number" min="0" className={inputClass} value={haltingChargePerDay} onChange={e => setHaltingChargePerDay(e.target.value)} /></label>\n              <div className="rounded-xl bg-purple-50 p-3 text-sm text-purple-800">Halting Fare<br /><b>{formatINR(haltingFare)}</b></div>\n            </div>\n          </section>'''
              new = '''          <section>\n            <h3 className="mb-3 text-sm font-bold uppercase tracking-wide text-slate-500">Halting</h3>\n            <div className="grid grid-cols-1 gap-4 md:grid-cols-2">\n              <div className="rounded-2xl border border-blue-200 bg-blue-50/40 p-4">\n                <h4 className="mb-3 text-sm font-bold text-blue-900">Loading Halting</h4>\n                <div className="grid grid-cols-1 gap-3 md:grid-cols-3">\n                  <label><span className={labelClass}>Days</span><input type="number" min="0" step="0.5" className={inputClass} value={loadingHaltingDays} onChange={e => setLoadingHaltingDays(e.target.value)} /></label>\n                  <label><span className={labelClass}>Charge / Day</span><input type="number" min="0" className={inputClass} value={loadingHaltingChargePerDay} onChange={e => setLoadingHaltingChargePerDay(e.target.value)} /></label>\n                  <div className="rounded-xl bg-white p-3 text-sm text-blue-800">Calculated Fare<br /><b>{formatINR(loadingHaltingFare)}</b></div>\n                </div>\n              </div>\n              <div className="rounded-2xl border border-orange-200 bg-orange-50/40 p-4">\n                <h4 className="mb-3 text-sm font-bold text-orange-900">Unloading Halting</h4>\n                <div className="grid grid-cols-1 gap-3 md:grid-cols-3">\n                  <label><span className={labelClass}>Days</span><input type="number" min="0" step="0.5" className={inputClass} value={unloadingHaltingDays} onChange={e => setUnloadingHaltingDays(e.target.value)} /></label>\n                  <label><span className={labelClass}>Charge / Day</span><input type="number" min="0" className={inputClass} value={unloadingHaltingChargePerDay} onChange={e => setUnloadingHaltingChargePerDay(e.target.value)} /></label>\n                  <div className="rounded-xl bg-white p-3 text-sm text-orange-800">Calculated Fare<br /><b>{formatINR(unloadingHaltingFare)}</b></div>\n                </div>\n              </div>\n            </div>\n            <div className="mt-3 rounded-xl bg-purple-50 p-3 text-sm text-purple-800">Total Halting: <b>{numberValue(loadingHaltingDays) + numberValue(unloadingHaltingDays)} days</b> · Total Fare: <b>{formatINR(haltingFare)}</b></div>\n          </section>'''
              if old not in s:
                  raise SystemExit('EditTripModal halting JSX pattern not found')
              s = s.replace(old, new)
              p.write_text(s)

          # ---------- AddTripPage: use heuristic replacements around existing halting state/JSX ----------
          p = Path('src/components/AddTripPage.tsx')
          s = p.read_text()
          if 'loadingHaltingDays' not in s:
              # State declarations: match existing names if present.
              m = re.search(r'(const \[haltingDays, setHaltingDays\][^\n]*\n)', s)
              if not m:
                  raise SystemExit('AddTripPage haltingDays state not found')
              s = s[:m.end()] + '  const [loadingHaltingDays, setLoadingHaltingDays] = useState("");\n  const [loadingHaltingChargePerDay, setLoadingHaltingChargePerDay] = useState("");\n  const [unloadingHaltingDays, setUnloadingHaltingDays] = useState("");\n  const [unloadingHaltingChargePerDay, setUnloadingHaltingChargePerDay] = useState("");\n' + s[m.end():]
              # Replace halting fare calculation wherever the common expression exists.
              patterns = [
                (r'const haltingFare\s*=\s*numberValue\(haltingDays\)\s*\*\s*numberValue\(haltingChargePerDay\);', 'const loadingHaltingFare = numberValue(loadingHaltingDays) * numberValue(loadingHaltingChargePerDay);\n  const unloadingHaltingFare = numberValue(unloadingHaltingDays) * numberValue(unloadingHaltingChargePerDay);\n  const haltingFare = loadingHaltingFare + unloadingHaltingFare;'),
                (r'const haltingFare\s*=\s*Number\(haltingDays\)\s*\*\s*Number\(haltingChargePerDay\);', 'const loadingHaltingFare = Number(loadingHaltingDays) * Number(loadingHaltingChargePerDay);\n  const unloadingHaltingFare = Number(unloadingHaltingDays) * Number(unloadingHaltingChargePerDay);\n  const haltingFare = loadingHaltingFare + unloadingHaltingFare;')
              ]
              for pat, rep in patterns:
                  s2, n = re.subn(pat, rep, s, count=1)
                  if n:
                      s = s2; break
              # Payload: add new fields next to existing halting_fare.
              if 'loading_halting_days:' not in s:
                  pat = r'(halting_fare\s*:\s*[^,\n]+,)'
                  rep = r'\1\n        loading_halting_days: Number(loadingHaltingDays) || 0,\n        loading_halting_charge_per_day: Number(loadingHaltingChargePerDay) || 0,\n        loading_halting_fare: loadingHaltingFare,\n        unloading_halting_days: Number(unloadingHaltingDays) || 0,\n        unloading_halting_charge_per_day: Number(unloadingHaltingChargePerDay) || 0,\n        unloading_halting_fare: unloadingHaltingFare,'
                  s, n = re.subn(pat, rep, s, count=1)
                  if not n:
                      raise SystemExit('AddTripPage halting payload not found')
              # Replace the first Halting JSX section using broad section boundaries.
              start = s.find('<h3', s.find('Halting'))
              if start == -1:
                  raise SystemExit('AddTripPage halting heading not found')
              # Find nearest enclosing section before heading and its close.
              sec_start = s.rfind('<section', 0, start)
              if sec_start == -1:
                  raise SystemExit('AddTripPage halting section start not found')
              sec_end = s.find('</section>', start)
              if sec_end == -1:
                  raise SystemExit('AddTripPage halting section end not found')
              sec_end += len('</section>')
              old_sec = s[sec_start:sec_end]
              if 'Halting' not in old_sec or 'Halting Days' not in old_sec:
                  raise SystemExit('AddTripPage existing halting section shape unexpected')
              new_sec = '''<section>\n            <h3 className="mb-3 text-sm font-bold uppercase tracking-wide text-slate-500">Halting</h3>\n            <div className="grid grid-cols-1 gap-4 md:grid-cols-2">\n              <div className="rounded-2xl border border-blue-200 bg-blue-50/40 p-4">\n                <h4 className="mb-3 text-sm font-bold text-blue-900">Loading Halting</h4>\n                <div className="grid grid-cols-1 gap-3 md:grid-cols-3">\n                  <label><span className={labelClass}>Days</span><input type="number" min="0" step="0.5" className={inputClass} value={loadingHaltingDays} onChange={e => setLoadingHaltingDays(e.target.value)} /></label>\n                  <label><span className={labelClass}>Charge / Day</span><input type="number" min="0" className={inputClass} value={loadingHaltingChargePerDay} onChange={e => setLoadingHaltingChargePerDay(e.target.value)} /></label>\n                  <div className="rounded-xl bg-white p-3 text-sm text-blue-800">Calculated Fare<br /><b>{formatINR(loadingHaltingFare)}</b></div>\n                </div>\n              </div>\n              <div className="rounded-2xl border border-orange-200 bg-orange-50/40 p-4">\n                <h4 className="mb-3 text-sm font-bold text-orange-900">Unloading Halting</h4>\n                <div className="grid grid-cols-1 gap-3 md:grid-cols-3">\n                  <label><span className={labelClass}>Days</span><input type="number" min="0" step="0.5" className={inputClass} value={unloadingHaltingDays} onChange={e => setUnloadingHaltingDays(e.target.value)} /></label>\n                  <label><span className={labelClass}>Charge / Day</span><input type="number" min="0" className={inputClass} value={unloadingHaltingChargePerDay} onChange={e => setUnloadingHaltingChargePerDay(e.target.value)} /></label>\n                  <div className="rounded-xl bg-white p-3 text-sm text-orange-800">Calculated Fare<br /><b>{formatINR(unloadingHaltingFare)}</b></div>\n                </div>\n              </div>\n            </div>\n            <div className="mt-3 rounded-xl bg-purple-50 p-3 text-sm text-purple-800">Total Halting: <b>{Number(loadingHaltingDays) + Number(unloadingHaltingDays)} days</b> · Total Fare: <b>{formatINR(haltingFare)}</b></div>\n          </section>'''
              # Preserve only if section uses the expected simple halting fields.
              s = s[:sec_start] + new_sec + s[sec_end:]
              p.write_text(s)

          # ---------- calculations: new halting totals while preserving old records ----------
          p = Path('src/lib/calculations.ts')
          s = p.read_text()
          if 'const loadingHalting = Number(t.loading_halting_days)' not in s:
              s = s.replace('    const halting = Number(t.halting_days) || 0;\n',
                  '    const loadingHalting = Number(t.loading_halting_days) || 0;\n    const unloadingHalting = Number(t.unloading_halting_days) || 0;\n    const halting = (loadingHalting + unloadingHalting) > 0 ? loadingHalting + unloadingHalting : (Number(t.halting_days) || 0);\n')
              p.write_text(s)

          # ---------- DriverReportPage: clickable Halting Days modal ----------
          p = Path('src/components/DriverReportPage.tsx')
          s = p.read_text()
          if 'HaltingDetailsModal' not in s:
              s = s.replace('import { TripDetailsModal } from "./TripDetailsModal";\n', 'import { TripDetailsModal } from "./TripDetailsModal";\nimport { HaltingDetailsModal } from "./HaltingDetailsModal";\n')
              s = s.replace('  const [inspectingTrip, setInspectingTrip] = useState<Trip | null>(null);\n', '  const [inspectingTrip, setInspectingTrip] = useState<Trip | null>(null);\n  const [showHaltingDetails, setShowHaltingDetails] = useState(false);\n')
              # Add button behavior to the exact Halting card by changing its outer div to a button-like clickable container.
              target = '<div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs hover:shadow-sm transition">\n            <div className="flex items-center justify-between text-slate-500">\n              <span className="text-xs font-bold uppercase tracking-wide text-purple-900">\n                Halting Days'
              replacement = '<button type="button" onClick={() => setShowHaltingDetails(true)} className="w-full text-left bg-white p-5 rounded-2xl border border-slate-200 shadow-xs hover:shadow-sm transition hover:border-purple-300 cursor-pointer">\n            <div className="flex items-center justify-between text-slate-500">\n              <span className="text-xs font-bold uppercase tracking-wide text-purple-900">\n                Halting Days'
              if target not in s:
                  raise SystemExit('DriverReportPage halting card target not found')
              s = s.replace(target, replacement, 1)
              # Close the card: the first occurrence of the card tail after the halting text.
              tail = '''            <div className="text-xs text-slate-500 mt-1">\n              Overall halting / detention days of {selectedDriverName}\n            </div>\n          </div>'''
              if tail not in s:
                  raise SystemExit('DriverReportPage halting card tail not found')
              s = s.replace(tail, '''            <div className="text-xs text-slate-500 mt-1">\n              Click to view loading vs unloading halting trips\n            </div>\n          </button>''', 1)
              # Insert modal before driver settlement section.
              marker = '      {/* Driver Settlement Progress Bar */}'
              modal = '''      <HaltingDetailsModal\n        isOpen={showHaltingDetails}\n        onClose={() => setShowHaltingDetails(false)}\n        trips={driverTrips}\n        driverName={selectedDriverName}\n      />\n\n'''
              if marker not in s:
                  raise SystemExit('DriverReportPage modal insertion marker not found')
              s = s.replace(marker, modal + marker, 1)
              p.write_text(s)

          # ---------- New modal component ----------
          modal_path = Path('src/components/HaltingDetailsModal.tsx')
          if not modal_path.exists():
              modal_path.write_text('''import React from "react";\nimport { X, Clock, Truck } from "lucide-react";\nimport { Trip } from "../types";\nimport { formatIndianDate, formatINR } from "../lib/calculations";\n\ninterface Props {\n  isOpen: boolean;\n  onClose: () => void;\n  trips: Trip[];\n  driverName: string;\n}\n\nexport const HaltingDetailsModal: React.FC<Props> = ({ isOpen, onClose, trips, driverName }) => {\n  if (!isOpen) return null;\n  const rows = trips.filter((t) => (Number(t.loading_halting_days) || 0) > 0 || (Number(t.unloading_halting_days) || 0) > 0 || (Number(t.halting_days) || 0) > 0);\n  return (\n    <div className="fixed inset-0 z-[60] flex items-center justify-center bg-slate-950/70 p-4">\n      <div className="w-full max-w-4xl max-h-[85vh] overflow-hidden rounded-3xl bg-white shadow-2xl">\n        <div className="flex items-center justify-between bg-slate-900 px-6 py-5 text-white">\n          <div><h2 className="text-lg font-bold">Halting Details</h2><p className="text-xs text-slate-400">{driverName} · loading and unloading halting trips</p></div>\n          <button onClick={onClose} className="rounded-lg p-2 hover:bg-slate-800" aria-label="Close"><X className="h-5 w-5" /></button>\n        </div>\n        <div className="max-h-[70vh] overflow-y-auto p-5">\n          {rows.length === 0 ? <div className="py-12 text-center text-slate-500"><Clock className="mx-auto mb-2 h-10 w-10 text-slate-300"/><p className="font-bold">No halting trips in this date range.</p></div> :\n          <div className="space-y-3">{rows.map((t) => {\n            const loadingDays = Number(t.loading_halting_days) || 0;\n            const unloadingDays = Number(t.unloading_halting_days) || 0;\n            const legacyDays = loadingDays + unloadingDays === 0 ? (Number(t.halting_days) || 0) : 0;\n            return <div key={t.id} className="rounded-2xl border border-slate-200 p-4">\n              <div className="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">\n                <div><div className="flex items-center gap-2 font-bold text-slate-900"><Truck className="h-4 w-4 text-blue-600"/>{t.vehicle_number || "Vehicle"}</div><div className="text-xs text-slate-500 mt-1">{formatIndianDate(t.trip_date)} · {t.from_city} → {t.to_city}</div></div>\n                <div className="text-sm font-black text-purple-800">Total {loadingDays + unloadingDays + legacyDays} days</div>\n              </div>\n              <div className="mt-3 grid grid-cols-1 sm:grid-cols-3 gap-3">\n                {loadingDays > 0 ? <div className="rounded-xl bg-blue-50 p-3"><div className="text-xs font-bold text-blue-800">Loading Halting</div><div className="font-black text-blue-950">{loadingDays} days</div><div className="text-xs text-blue-700">{formatINR(Number(t.loading_halting_fare) || loadingDays * (Number(t.loading_halting_charge_per_day) || 0))}</div></div> : null}\n                {unloadingDays > 0 ? <div className="rounded-xl bg-orange-50 p-3"><div className="text-xs font-bold text-orange-800">Unloading Halting</div><div className="font-black text-orange-950">{unloadingDays} days</div><div className="text-xs text-orange-700">{formatINR(Number(t.unloading_halting_fare) || unloadingDays * (Number(t.unloading_halting_charge_per_day) || 0))}</div></div> : null}\n                {legacyDays > 0 ? <div className="rounded-xl bg-slate-50 p-3"><div className="text-xs font-bold text-slate-700">Existing Halting</div><div className="font-black text-slate-950">{legacyDays} days</div><div className="text-xs text-slate-600">Legacy record (not changed)</div></div> : null}\n              </div>\n            </div>;\n          })}</div>}\n        </div>\n      </div>\n    </div>\n  );\n};\n''')

          # ---------- AddTrip state initialization safety ----------
          # New records have no legacy halting values; ensure they are totalled correctly.
          # We intentionally do not touch stored old values.

          print('Halting UI patch complete')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/EditTripModal.tsx src/components/AddTripPage.tsx src/lib/calculations.ts src/components/DriverReportPage.tsx src/components/HaltingDetailsModal.tsx
          git diff --cached --quiet && echo "No changes needed" || git commit -m "Add loading and unloading halting details"
          git push
          rm -f .github/workflows/apply-halting-report-ui.yml
          git add .github/workflows/apply-halting-report-ui.yml
          git commit -m "Remove temporary halting UI workflow" || true
          git push || true
