name: Restore Vehicle Report

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  restore:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Restore Vehicle Report from known-good version')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore exact known-good Vehicle Report
        run: |
          curl -fsSL "https://raw.githubusercontent.com/thamaraiselvan2004/Sri-Vishnu-Transport/15aa787e02e15bad082888ca000b73ec6f4c43d4/src/components/VehicleReportPage.tsx" -o src/components/VehicleReportPage.tsx
          test -s src/components/VehicleReportPage.tsx

      - name: Install dependencies
        run: npm install

      - name: Build application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Commit restored Vehicle Report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/VehicleReportPage.tsx
          git diff --cached --quiet && echo 'No restore changes' || git commit -m 'Restore Vehicle Report from known-good version'
          git push
