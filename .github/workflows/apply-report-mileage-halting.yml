name: Apply Report Mileage and Halting Updates

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          # ---- types.ts ----
          p = root/'src/types.ts'
          s = p.read_text()
          s = s.replace("  // Halting Details\n  halting_days?: number;\n  halting_charge_per_day?: number;\n  halting_fare?: number; // Halting days * Halting charge/day\n", "  // Halting Details (separate loading/unloading)\n  halting_days?: number;\n  halting_charge_per_day?: number;\n  halting_fare?: number; // Combined loading + unloading halting fare\n  loading_halting_days?: number;\n  loading_halting_charge_per_day?: number;\n  loading_halting_fare?: number;\n  unloading_halting_days?: number;\n  unloading_halting_charge_per_day?: number;\n  unloading_halting_fare?: number;\n")
          marker = "export interface MaintenanceRecord {"
          manual = '''export interface ManualMileageRecord {\n  id: string;\n  vehicle_id: string;\n  record_date: string;\n  trip_number: number;\n  starting_odometer: number;\n  ending_odometer: number;\n  diesel_litres: number;\n  mileage: number;\n  created_at: string;\n  vehicle_number?: string;\n}\n\n'''
          if 'export interface ManualMileageRecord' not in s:
              s = s.replace(marker, manual + marker)
          p.write_text(s)

          # ---- database.ts ----
          p = root/'src/lib/database.ts'
          s = p.read_text()
          s = s.replace('import { Vehicle, Driver, Trip, MaintenanceRecord } from "../types";', 'import { Vehicle, Driver, Trip, MaintenanceRecord, ManualMileageRecord } from "../types";')
          s = s.replace('    "halting_fare",\n', '    "halting_fare",\n    "loading_halting_days",\n    "loading_halting_charge_per_day",\n    "loading_halting_fare",\n    "unloading_halting_days",\n    "unloading_halting_charge_per_day",\n    "unloading_halting_fare",\n')
          insert = '''\nexport async function getManualMileageRecords(vehicleId?: string): Promise<ManualMileageRecord[]> {\n  const client = requireSupabase();\n  let query = client.from("manual_mileage").select("*").order("record_date", { ascending: false }).order("trip_number", { ascending: false });\n  if (vehicleId) query = query.eq("vehicle_id", vehicleId);\n  const { data, error } = await query;\n  if (error) throw error;\n  const vehicles = await getVehicles();\n  const vehicleMap = new Map(vehicles.map((v) => [v.id, v.vehicle_number]));\n  return ((data ?? []) as ManualMileageRecord[]).map((r) => ({ ...r, vehicle_number: vehicleMap.get(r.vehicle_id) ?? r.vehicle_number }));\n}\n\nexport async function addManualMileageRecord(data: Omit<ManualMileageRecord, "id" | "created_at" | "trip_number" | "vehicle_number">): Promise<ManualMileageRecord> {\n  const client = requireSupabase();\n  const { data: last, error: lastError } = await client.from("manual_mileage").select("trip_number").eq("vehicle_id", data.vehicle_id).order("trip_number", { ascending: false }).limit(1).maybeSingle();\n  if (lastError) throw lastError;\n  const tripNumber = Number(last?.trip_number || 0) + 1;\n  const { data: row, error } = await client.from("manual_mileage").insert({ ...data, trip_number: tripNumber }).select().single();\n  if (error) throw error;\n  const vehicles = await getVehicles();\n  return { ...(row as ManualMileageRecord), vehicle_number: vehicles.find((v) => v.id === data.vehicle_id)?.vehicle_number };\n}\n\nexport async function deleteManualMileageRecord(id: string): Promise<void> {\n  const { error } = await requireSupabase().from("manual_mileage").delete().eq("id", id);\n  if (error) throw error;\n}\n\n'''
          if 'export async function getManualMileageRecords' not in s:
              s = s.replace('export async function getMaintenanceRecords(', insert + 'export async function getMaintenanceRecords(')
          p.write_text(s)

          # ---- schema ----
          p = root/'supabase_schema.sql'
          s = p.read_text()
          s = s.replace('  halting_fare NUMERIC(12, 2) NOT NULL DEFAULT 0,\n', '  halting_fare NUMERIC(12, 2) NOT NULL DEFAULT 0,\n  loading_halting_days NUMERIC(10, 2) NOT NULL DEFAULT 0,\n  loading_halting_charge_per_day NUMERIC(12, 2) NOT NULL DEFAULT 0,\n  loading_halting_fare NUMERIC(12, 2) NOT NULL DEFAULT 0,\n  unloading_halting_days NUMERIC(10, 2) NOT NULL DEFAULT 0,\n  unloading_halting_charge_per_day NUMERIC(12, 2) NOT NULL DEFAULT 0,\n  unloading_halting_fare NUMERIC(12, 2) NOT NULL DEFAULT 0,\n')
          if 'CREATE TABLE IF NOT EXISTS manual_mileage' not in s:
              s += '''\n\nCREATE TABLE IF NOT EXISTS manual_mileage (\n  id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),\n  vehicle_id UUID NOT NULL REFERENCES vehicles(id) ON DELETE CASCADE,\n  record_date DATE NOT NULL DEFAULT CURRENT_DATE,\n  trip_number INTEGER NOT NULL,\n  starting_odometer NUMERIC(12,2) NOT NULL DEFAULT 0,\n  ending_odometer NUMERIC(12,2) NOT NULL DEFAULT 0,\n  diesel_litres NUMERIC(12,2) NOT NULL DEFAULT 0,\n  mileage NUMERIC(10,2) NOT NULL DEFAULT 0,\n  created_at TIMESTAMPTZ NOT NULL DEFAULT timezone('utc'::text, now())\n);\n\nCREATE INDEX IF NOT EXISTS idx_manual_mileage_vehicle_id ON manual_mileage(vehicle_id);\nCREATE INDEX IF NOT EXISTS idx_manual_mileage_vehicle_trip ON manual_mileage(vehicle_id, trip_number);\nALTER TABLE manual_mileage ENABLE ROW LEVEL SECURITY;\nDROP POLICY IF EXISTS manual_mileage_anon_select ON manual_mileage;\nDROP POLICY IF EXISTS manual_mileage_anon_insert ON manual_mileage;\nDROP POLICY IF EXISTS manual_mileage_anon_update ON manual_mileage;\nDROP POLICY IF EXISTS manual_mileage_anon_delete ON manual_mileage;\nCREATE POLICY manual_mileage_anon_select ON manual_mileage FOR SELECT TO anon USING (true);\nCREATE POLICY manual_mileage_anon_insert ON manual_mileage FOR INSERT TO anon WITH CHECK (true);\nCREATE POLICY manual_mileage_anon_update ON manual_mileage FOR UPDATE TO anon USING (true) WITH CHECK (true);\nCREATE POLICY manual_mileage_anon_delete ON manual_mileage FOR DELETE TO anon USING (true);\n'''
          p.write_text(s)

          # ---- AddTripPage: separate loading/unloading halting while preserving total fields ----
          p = root/'src/components/AddTripPage.tsx'
          s = p.read_text()
          s = s.replace('  const [haltingDays, setHaltingDays] = useState<string>("0");\n  const [haltingChargePerDay, setHaltingChargePerDay] = useState<string>("0");', '  const [loadingHaltingDays, setLoadingHaltingDays] = useState<string>("0");\n  const [loadingHaltingChargePerDay, setLoadingHaltingChargePerDay] = useState<string>("0");\n  const [unloadingHaltingDays, setUnloadingHaltingDays] = useState<string>("0");\n  const [unloadingHaltingChargePerDay, setUnloadingHaltingChargePerDay] = useState<string>("0");')
          s = s.replace('  const numHaltingDays = parseFloat(haltingDays) || 0;\n  const numHaltingChargePerDay = parseFloat(haltingChargePerDay) || 0;\n  const haltingFare = numHaltingDays * numHaltingChargePerDay;', '  const numLoadingHaltingDays = parseFloat(loadingHaltingDays) || 0;\n  const numLoadingHaltingChargePerDay = parseFloat(loadingHaltingChargePerDay) || 0;\n  const loadingHaltingFare = numLoadingHaltingDays * numLoadingHaltingChargePerDay;\n  const numUnloadingHaltingDays = parseFloat(unloadingHaltingDays) || 0;\n  const numUnloadingHaltingChargePerDay = parseFloat(unloadingHaltingChargePerDay) || 0;\n  const unloadingHaltingFare = numUnloadingHaltingDays * numUnloadingHaltingChargePerDay;\n  const numHaltingDays = numLoadingHaltingDays + numUnloadingHaltingDays;\n  const haltingFare = loadingHaltingFare + unloadingHaltingFare;')
          s = re.sub(r'\{\/\* Halting Details \*\/\}.*?\{\/\* Advance & Balance Details \*\}', '''{/* Halting Details */}\n          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">\n            <div className="rounded-2xl border border-blue-200 bg-blue-50/50 p-4">\n              <h3 className="text-sm font-bold text-blue-800 mb-3">Loading Halting</h3>\n              <div className="grid grid-cols-3 gap-3">\n                <div><label className="block text-xs font-semibold text-slate-600 mb-1">Days</label><input type="number" min="0" step="0.5" value={loadingHaltingDays} onChange={(e)=>setLoadingHaltingDays(e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-300" /></div>\n                <div><label className="block text-xs font-semibold text-slate-600 mb-1">Charge / Day</label><input type="number" min="0" step="0.01" value={loadingHaltingChargePerDay} onChange={(e)=>setLoadingHaltingChargePerDay(e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-300" /></div>\n                <div><label className="block text-xs font-semibold text-slate-600 mb-1">Fare</label><div className="px-3 py-2 rounded-xl bg-white border border-blue-200 font-mono font-bold">₹{loadingHaltingFare.toFixed(2)}</div></div>\n              </div>\n            </div>\n            <div className="rounded-2xl border border-orange-200 bg-orange-50/50 p-4">\n              <h3 className="text-sm font-bold text-orange-800 mb-3">Unloading Halting</h3>\n              <div className="grid grid-cols-3 gap-3">\n                <div><label className="block text-xs font-semibold text-slate-600 mb-1">Days</label><input type="number" min="0" step="0.5" value={unloadingHaltingDays} onChange={(e)=>setUnloadingHaltingDays(e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-300" /></div>\n                <div><label className="block text-xs font-semibold text-slate-600 mb-1">Charge / Day</label><input type="number" min="0" step="0.01" value={unloadingHaltingChargePerDay} onChange={(e)=>setUnloadingHaltingChargePerDay(e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-300" /></div>\n                <div><label className="block text-xs font-semibold text-slate-600 mb-1">Fare</label><div className="px-3 py-2 rounded-xl bg-white border border-orange-200 font-mono font-bold">₹{unloadingHaltingFare.toFixed(2)}</div></div>\n              </div>\n            </div>\n          </div>\n          <div className="text-xs text-slate-500 font-semibold">Total Halting: {numHaltingDays} days · ₹{haltingFare.toFixed(2)}</div>\n\n          {/* Advance & Balance Details */}''', s, flags=re.S)
          # Add new fields wherever the existing trip object contains halting_fare.
          s = s.replace('halting_fare: haltingFare,', 'halting_fare: haltingFare,\n      loading_halting_days: numLoadingHaltingDays,\n      loading_halting_charge_per_day: numLoadingHaltingChargePerDay,\n      loading_halting_fare: loadingHaltingFare,\n      unloading_halting_days: numUnloadingHaltingDays,\n      unloading_halting_charge_per_day: numUnloadingHaltingChargePerDay,\n      unloading_halting_fare: unloadingHaltingFare,')
          p.write_text(s)

          # ---- EditTripModal: support the same separate halting fields ----
          p = root/'src/components/EditTripModal.tsx'
          s = p.read_text()
          s = s.replace('  const [haltingDays, setHaltingDays] = useState<string>(String(trip.halting_days ?? 0));\n  const [haltingChargePerDay, setHaltingChargePerDay] = useState<string>(String(trip.halting_charge_per_day ?? 0));', '  const [loadingHaltingDays, setLoadingHaltingDays] = useState<string>(String(trip.loading_halting_days ?? 0));\n  const [loadingHaltingChargePerDay, setLoadingHaltingChargePerDay] = useState<string>(String(trip.loading_halting_charge_per_day ?? 0));\n  const [unloadingHaltingDays, setUnloadingHaltingDays] = useState<string>(String(trip.unloading_halting_days ?? 0));\n  const [unloadingHaltingChargePerDay, setUnloadingHaltingChargePerDay] = useState<string>(String(trip.unloading_halting_charge_per_day ?? 0));')
          s = re.sub(r'const numHaltingDays = parseFloat\(haltingDays\).*?const haltingFare = numHaltingDays \* numHaltingChargePerDay;', 'const numLoadingHaltingDays = parseFloat(loadingHaltingDays) || 0;\n  const numLoadingHaltingChargePerDay = parseFloat(loadingHaltingChargePerDay) || 0;\n  const loadingHaltingFare = numLoadingHaltingDays * numLoadingHaltingChargePerDay;\n  const numUnloadingHaltingDays = parseFloat(unloadingHaltingDays) || 0;\n  const numUnloadingHaltingChargePerDay = parseFloat(unloadingHaltingChargePerDay) || 0;\n  const unloadingHaltingFare = numUnloadingHaltingDays * numUnloadingHaltingChargePerDay;\n  const numHaltingDays = numLoadingHaltingDays + numUnloadingHaltingDays;\n  const haltingFare = loadingHaltingFare + unloadingHaltingFare;', s, flags=re.S)
          s = s.replace('halting_fare: haltingFare,', 'halting_fare: haltingFare,\n      loading_halting_days: numLoadingHaltingDays,\n      loading_halting_charge_per_day: numLoadingHaltingChargePerDay,\n      loading_halting_fare: loadingHaltingFare,\n      unloading_halting_days: numUnloadingHaltingDays,\n      unloading_halting_charge_per_day: numUnloadingHaltingChargePerDay,\n      unloading_halting_fare: unloadingHaltingFare,')
          s = re.sub(r'\{\/\* Halting Details \*\/\}.*?\{\/\* Advance & Balance Details \*\}', '''{/* Halting Details */}\n          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">\n            <div className="rounded-2xl border border-blue-200 bg-blue-50/50 p-4"><h3 className="text-sm font-bold text-blue-800 mb-3">Loading Halting</h3><div className="grid grid-cols-3 gap-3"><div><label className="block text-xs font-semibold text-slate-600 mb-1">Days</label><input type="number" min="0" step="0.5" value={loadingHaltingDays} onChange={(e)=>setLoadingHaltingDays(e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-300" /></div><div><label className="block text-xs font-semibold text-slate-600 mb-1">Charge / Day</label><input type="number" min="0" step="0.01" value={loadingHaltingChargePerDay} onChange={(e)=>setLoadingHaltingChargePerDay(e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-300" /></div><div><label className="block text-xs font-semibold text-slate-600 mb-1">Fare</label><div className="px-3 py-2 rounded-xl bg-white border border-blue-200 font-mono font-bold">₹{loadingHaltingFare.toFixed(2)}</div></div></div></div>\n            <div className="rounded-2xl border border-orange-200 bg-orange-50/50 p-4"><h3 className="text-sm font-bold text-orange-800 mb-3">Unloading Halting</h3><div className="grid grid-cols-3 gap-3"><div><label className="block text-xs font-semibold text-slate-600 mb-1">Days</label><input type="number" min="0" step="0.5" value={unloadingHaltingDays} onChange={(e)=>setUnloadingHaltingDays(e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-300" /></div><div><label className="block text-xs font-semibold text-slate-600 mb-1">Charge / Day</label><input type="number" min="0" step="0.01" value={unloadingHaltingChargePerDay} onChange={(e)=>setUnloadingHaltingChargePerDay(e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-300" /></div><div><label className="block text-xs font-semibold text-slate-600 mb-1">Fare</label><div className="px-3 py-2 rounded-xl bg-white border border-orange-200 font-mono font-bold">₹{unloadingHaltingFare.toFixed(2)}</div></div></div></div>\n          </div>\n\n          {/* Advance & Balance Details */}''', s, flags=re.S)
          p.write_text(s)

          # ---- Driver report: add a halting details modal section after driverTrips is computed ----
          p = root/'src/components/DriverReportPage.tsx'
          s = p.read_text()
          s = s.replace('  const [inspectingTrip, setInspectingTrip] = useState<Trip | null>(null);', '  const [inspectingTrip, setInspectingTrip] = useState<Trip | null>(null);\n  const [showHaltingTrips, setShowHaltingTrips] = useState(false);')
          if 'showHaltingTrips' in s:
              # Make existing overall halting-days metric clickable where the visible label/value occurs.
              s = s.replace('<div className="text-xl font-black font-mono text-white mt-1">\n                {stats.overallHaltingDays}', '<button type="button" onClick={() => setShowHaltingTrips(true)} className="text-left w-full hover:opacity-80 transition"><div className="text-xl font-black font-mono text-white mt-1">\n                {stats.overallHaltingDays}')
              s = s.replace('</div>\n              <div className="text-[10px] text-slate-400 mt-0.5">\n                Halting days', '</div></button>\n              <div className="text-[10px] text-slate-400 mt-0.5">\n                Halting days')
              # Insert modal before final return close by anchoring the main returned root's last closing section.
              modal = '''\n      {showHaltingTrips && (\n        <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4" onClick={() => setShowHaltingTrips(false)}>\n          <div className="bg-white rounded-3xl shadow-2xl max-w-3xl w-full max-h-[80vh] overflow-auto p-6" onClick={(e) => e.stopPropagation()}>\n            <div className="flex items-center justify-between mb-4"><div><h3 className="text-xl font-black text-slate-900">Halting Trips</h3><p className="text-xs text-slate-500">Loading and unloading halting for {selectedDriverName}</p></div><button type="button" onClick={() => setShowHaltingTrips(false)} className="px-3 py-2 rounded-xl bg-slate-100 font-bold">Close</button></div>\n            <div className="space-y-3">\n              {driverTrips.filter((t) => (t.halting_days ?? 0) > 0 || (t.loading_halting_days ?? 0) > 0 || (t.unloading_halting_days ?? 0) > 0).map((t) => (\n                <div key={t.id} className="border border-slate-200 rounded-2xl p-4">\n                  <div className="flex flex-wrap justify-between gap-2"><span className="font-bold">{formatIndianDate(t.trip_date)}</span><span className="font-mono font-bold">{t.vehicle_number || ""}</span></div>\n                  <div className="text-sm text-slate-600 mt-1">{t.from_city} → {t.to_city}</div>\n                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-3">\n                    {(t.loading_halting_days ?? 0) > 0 && <div className="rounded-xl bg-blue-50 p-3"><div className="font-bold text-blue-800">Loading Halting</div><div>{t.loading_halting_days} days × ₹{t.loading_halting_charge_per_day ?? 0}/day = ₹{t.loading_halting_fare ?? 0}</div></div>}\n                    {(t.unloading_halting_days ?? 0) > 0 && <div className="rounded-xl bg-orange-50 p-3"><div className="font-bold text-orange-800">Unloading Halting</div><div>{t.unloading_halting_days} days × ₹{t.unloading_halting_charge_per_day ?? 0}/day = ₹{t.unloading_halting_fare ?? 0}</div></div>}\n                  </div>\n                </div>\n              ))}\n              {driverTrips.filter((t) => (t.halting_days ?? 0) > 0 || (t.loading_halting_days ?? 0) > 0 || (t.unloading_halting_days ?? 0) > 0).length === 0 && <div className="text-center text-sm text-slate-500 py-8">No halting trips in the selected date range.</div>}\n            </div>\n          </div>\n        </div>\n      )}\n'''
              # Put modal just before the component's final closing tag pattern.
              idx = s.rfind('\n  );\n};')
              if idx != -1 and 'Halting Trips' not in s:
                  s = s[:idx] + modal + s[idx:]
          p.write_text(s)

          print('Applied source updates')
          PY
      - name: Verify TypeScript build
        run: |
          npm install
          npx tsc --noEmit
      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src supabase_schema.sql
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Add separate halting breakdown and manual mileage foundation"
          git push
