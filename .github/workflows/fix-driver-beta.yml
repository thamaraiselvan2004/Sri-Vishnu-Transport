name: Fix Driver Report Beta Calculation

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Fix driver report beta calculation')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove halting adjustment from Overall Driver Beta
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/components/DriverReportPage.tsx')
          s = p.read_text()

          # Remove accidental duplicate import that causes the Driver Report to fail compilation.
          s = s.replace(
              'import { updateDriverHaltingAmount } from "../lib/database";\nimport { updateDriverHaltingAmount } from "../lib/database";\n',
              'import { updateDriverHaltingAmount } from "../lib/database";\n'
          )

          # Remove the halting adjustment that was incorrectly added to Overall Driver Beta.
          s = re.sub(
              r'\n  const overallHaltingAmount = useMemo\(\(\) => \{.*?\n  \}, \[stats\.overallHaltingDays, haltingAmountPerDay\]\);\n\n  const adjustedOverallDriverBeta = \(Number\(stats\.overallDriverBeta\) \|\| 0\) \+ overallHaltingAmount;\n',
              '\n',
              s,
              flags=re.S,
          )

          # Keep the separate halting amount calculation available for the report/export,
          # but calculate it only after stats has been declared.
          marker = '  // Filter trips for the selected driver and date range\n'
          if 'const overallHaltingAmount = useMemo' not in s:
              block = '''  const overallHaltingAmount = useMemo(() => {\n    return Math.max(0, Number(stats.overallHaltingDays) || 0) * Math.max(0, Number(haltingAmountPerDay) || 0);\n  }, [stats.overallHaltingDays, haltingAmountPerDay]);\n\n'''
              if marker not in s:
                  raise SystemExit('Expected Driver Report marker not found')
              s = s.replace(marker, block + marker, 1)

          # Overall Driver Beta must be the existing trip-based beta only.
          s = s.replace('adjustedOverallDriverBeta', 'stats.overallDriverBeta')

          p.write_text(s)
          PY

      - name: Install dependencies
        run: npm install

      - name: Build application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/DriverReportPage.tsx
          git diff --cached --quiet && echo 'No driver beta fix changes' || git commit -m 'Fix driver report beta calculation'
          git push
