name: Apply Back Navigation and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  patch-and-deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Add back navigation only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          s = app.read_text()

          s = s.replace(
              'import { PlusCircle, Loader2, CheckCircle2 } from "lucide-react";',
              'import { PlusCircle, Loader2, CheckCircle2, ArrowLeft } from "lucide-react";'
          )

          marker = '  const [currentTab, setCurrentTab] = useState<string>("home");\n'
          if 'const [tabHistory, setTabHistory]' not in s:
              if marker not in s:
                  raise SystemExit('App currentTab marker not found')
              insert = '''  const [tabHistory, setTabHistory] = useState<string[]>([]);\n\n  const navigateTo = useCallback((tab: string) => {\n    if (tab === "home") {\n      setTabHistory([]);\n      setCurrentTab("home");\n      window.scrollTo({ top: 0, behavior: "smooth" });\n      return;\n    }\n    setCurrentTab((current) => {\n      if (current !== tab) setTabHistory((history) => [...history, current]);\n      return tab;\n    });\n    window.scrollTo({ top: 0, behavior: "smooth" });\n  }, []);\n\n  const handleBack = useCallback(() => {\n    setTabHistory((history) => {\n      if (history.length === 0) return history;\n      const next = [...history];\n      const previous = next.pop()!;\n      setCurrentTab(previous);\n      if (previous !== "reports") setSelectedVehicleForReport(undefined);\n      window.scrollTo({ top: 0, behavior: "smooth" });\n      return next;\n    });\n  }, []);\n'''
              s = s.replace(marker, marker + insert, 1)

          old_nav = '''        setCurrentTab={(tab) => {\n          if (tab !== "reports") setSelectedVehicleForReport(undefined);\n          setCurrentTab(tab);\n          window.scrollTo({ top: 0, behavior: "smooth" });\n        }}'''
          new_nav = '''        setCurrentTab={(tab) => {\n          if (tab !== "reports") setSelectedVehicleForReport(undefined);\n          navigateTo(tab);\n        }}'''
          if old_nav in s:
              s = s.replace(old_nav, new_nav, 1)

          marker = '''      </Navbar>\n\n      <main className="flex-1 pb-16">'''
          replacement = '''      </Navbar>\n\n      {currentTab !== "home" && currentTab !== "reports" && tabHistory.length > 0 && (\n        <div className="max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 pt-4">\n          <button\n            id="global-back-btn"\n            type="button"\n            onClick={handleBack}\n            className="inline-flex items-center gap-2 px-3 py-2 rounded-xl bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 shadow-sm text-sm font-bold transition"\n            aria-label="Go back to previous page"\n          >\n            <ArrowLeft className="w-4 h-4" />\n            <span>Back</span>\n          </button>\n        </div>\n      )}\n\n      <main className="flex-1 pb-16">'''
          if marker not in s:
              raise SystemExit('App main marker not found')
          s = s.replace(marker, replacement, 1)

          old_home_nav = '''                  setSelectedVehicleForReport(vehicleId);\n                  setCurrentTab(tab);\n                  window.scrollTo({ top: 0, behavior: "smooth" });'''
          new_home_nav = '''                  setSelectedVehicleForReport(vehicleId);\n                  navigateTo(tab);'''
          s = s.replace(old_home_nav, new_home_nav, 1)
          s = s.replace('onNavigateHome={() => setCurrentTab("home")}', 'onNavigateHome={() => navigateTo("home")}')
          s = s.replace('''              setCurrentTab("add-trip");\n              window.scrollTo({ top: 0, behavior: "smooth" });''', '''              navigateTo("add-trip");''', 1)
          s = s.replace('''                  onDeleteTrip={handleDeleteTrip}\n                  onUpdateTrip={handleUpdateTrip}\n                />''', '''                  onDeleteTrip={handleDeleteTrip}\n                  onUpdateTrip={handleUpdateTrip}\n                  onNavigateHome={() => navigateTo("home")}\n                />''', 1)
          app.write_text(s)

          reports = Path('src/components/ReportAnalysisContainer.tsx')
          s = reports.read_text()
          s = s.replace('''  IndianRupee,\n} from "lucide-react";''', '''  IndianRupee,\n  ArrowLeft,\n} from "lucide-react";''')
          s = s.replace('''  onUpdateTrip?: (tripId: string, tripData: Partial<Trip>) => Promise<void>;\n}''', '''  onUpdateTrip?: (tripId: string, tripData: Partial<Trip>) => Promise<void>;\n  onNavigateHome?: () => void;\n}''')
          s = s.replace('''  onUpdateTrip,\n}) => {''', '''  onUpdateTrip,\n  onNavigateHome,\n}) => {''')
          old_return = '''    return (\n      <VehicleReportPage\n        vehicle={currentVehicle}'''
          new_return = '''    return (\n      <>\n        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 sm:pt-8">\n          <button\n            id="report-back-btn"\n            type="button"\n            onClick={() => setSelectedVehicleId(null)}\n            className="inline-flex items-center gap-2 px-3 py-2 rounded-xl bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 shadow-sm text-sm font-bold transition"\n            aria-label="Back to report analysis"\n          >\n            <ArrowLeft className="w-4 h-4" />\n            <span>Back</span>\n          </button>\n        </div>\n        <VehicleReportPage\n        vehicle={currentVehicle}'''
          if old_return not in s:
              raise SystemExit('Vehicle report return marker not found')
          s = s.replace(old_return, new_return, 1)
          old_close = '''        onDeleteTrip={onDeleteTrip}\n        onUpdateTrip={onUpdateTrip}\n      />\n    );'''
          new_close = '''        onDeleteTrip={onDeleteTrip}\n        onUpdateTrip={onUpdateTrip}\n      />\n      </>\n    );'''
          s = s.replace(old_close, new_close, 1)
          list_marker = '''    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-10 space-y-8">'''
          list_replacement = '''    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-10 space-y-8">\n      <button\n        id="reports-home-back-btn"\n        type="button"\n        onClick={onNavigateHome}\n        className="inline-flex items-center gap-2 px-3 py-2 rounded-xl bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 shadow-sm text-sm font-bold transition"\n        aria-label="Back to home page"\n      >\n        <ArrowLeft className="w-4 h-4" />\n        <span>Back</span>\n      </button>'''
          if list_marker not in s:
              raise SystemExit('Reports list marker not found')
          s = s.replace(list_marker, list_replacement, 1)
          reports.write_text(s)
          print('Back navigation patch applied')
          PY

      - name: Install dependencies
        run: npm install

      - name: Build Vite app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npx vite build

      - name: Commit source change and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/components/ReportAnalysisContainer.tsx
          git rm .github/workflows/apply-back-navigation.yml
          git commit -m 'Add back navigation to app pages'
          git push

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dist
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
