name: Monthly Business Summary One-Time Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'Apply monthly business summary') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Home Page
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/HomePage.tsx')
          s = p.read_text()
          old = '''  // Quick total revenue and total profit calculations
  const totalRevenue = trips.reduce((sum, t) => sum + (t.trip_fare || 0), 0);
  const totalTripProfit = trips.reduce((sum, t) => sum + (t.net_profit || 0), 0);
  const totalMaintenanceExpense = maintenance.reduce(
    (sum, m) => sum + (m.amount || 0),
    0
  );
  const totalHalting = trips.reduce(
    (sum, t) => sum + (Number(t.loading_halting_fare) || 0) + (Number(t.unloading_halting_fare) || 0),
    0
  );
  const finalProfit = totalTripProfit - totalMaintenanceExpense + totalHalting;
'''
          new = '''  // Current-month business summary. Historical records remain untouched.
  const now = new Date();
  const currentMonthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
  const currentMonthLabel = now.toLocaleDateString("en-IN", { month: "long", year: "numeric" });

  const getMonthKey = (value?: string) => {
    if (!value) return "";
    const match = String(value).match(/^(\\d{4})-(\\d{2})/);
    if (match) return `${match[1]}-${match[2]}`;
    const parsed = new Date(value);
    return Number.isNaN(parsed.getTime()) ? "" : `${parsed.getFullYear()}-${String(parsed.getMonth() + 1).padStart(2, "0")}`;
  };

  const currentMonthTrips = trips.filter((t) => getMonthKey(t.trip_date) === currentMonthKey);
  const currentMonthMaintenance = maintenance.filter((m) => getMonthKey(m.maintenance_date) === currentMonthKey);
  const totalRevenue = currentMonthTrips.reduce((sum, t) => sum + (Number(t.trip_fare) || 0), 0);
  const totalTripProfit = currentMonthTrips.reduce((sum, t) => sum + (Number(t.net_profit) || 0), 0);
  const totalMaintenanceExpense = currentMonthMaintenance.reduce((sum, m) => sum + (Number(m.amount) || 0), 0);
  const totalHalting = currentMonthTrips.reduce((sum, t) => sum + (Number(t.loading_halting_fare) || 0) + (Number(t.unloading_halting_fare) || 0), 0);
  const finalProfit = totalTripProfit - totalMaintenanceExpense + totalHalting;

  const monthlySummary = new Map<string, { trips: number; revenue: number; profit: number }>();
  for (const trip of trips) {
    const month = getMonthKey(trip.trip_date);
    if (!month) continue;
    const entry = monthlySummary.get(month) || { trips: 0, revenue: 0, profit: 0 };
    entry.trips += 1;
    entry.revenue += Number(trip.trip_fare) || 0;
    entry.profit += Number(trip.net_profit) || 0;
    entry.profit += (Number(trip.loading_halting_fare) || 0) + (Number(trip.unloading_halting_fare) || 0);
    monthlySummary.set(month, entry);
  }
  for (const record of maintenance) {
    const month = getMonthKey(record.maintenance_date);
    if (!month) continue;
    const entry = monthlySummary.get(month) || { trips: 0, revenue: 0, profit: 0 };
    entry.profit -= Number(record.amount) || 0;
    monthlySummary.set(month, entry);
  }
  const monthlyReports = Array.from(monthlySummary.entries()).sort(([a], [b]) => b.localeCompare(a));
'''
          if old not in s: raise SystemExit('HomePage KPI block not found')
          s = s.replace(old, new, 1)
          old_trips = '''{trips.length}\n          </div>\n          <div className="text-xs text-slate-500 mt-1">\n            Digitally logged trips'''
          new_trips = '''{currentMonthTrips.length}\n          </div>\n          <div className="text-xs text-slate-500 mt-1">\n            {currentMonthLabel}'''
          if old_trips not in s: raise SystemExit('Total Trips KPI block not found')
          s = s.replace(old_trips, new_trips, 1)
          old_revenue = '''{formatINR(totalRevenue)}\n          </div>\n          <div className="text-xs text-slate-500 mt-1">Gross freight fare'''
          new_revenue = '''{formatINR(totalRevenue)}\n          </div>\n          <div className="text-xs text-slate-500 mt-1">{currentMonthLabel}'''
          if old_revenue not in s: raise SystemExit('Total Revenue KPI block not found')
          s = s.replace(old_revenue, new_revenue, 1)
          marker = '''      {/* Vehicle Quick Selector & Recent Trips */}\n'''
          report = '''      {/* Monthly Business Report */}\n      <section className="mb-10 bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">\n        <div className="p-6 border-b border-slate-200 bg-slate-50/70">\n          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">\n            <div>\n              <h2 className="text-lg font-bold text-slate-900">Monthly Business Report</h2>\n              <p className="text-xs text-slate-500 mt-1">Monthly totals are calculated from the existing trip and maintenance records.</p>\n            </div>\n            <div className="text-xs font-semibold text-blue-700 bg-blue-50 border border-blue-200 rounded-lg px-3 py-1.5">Current: {currentMonthLabel}</div>\n          </div>\n        </div>\n        <div className="overflow-x-auto">\n          <table className="w-full min-w-[640px] text-sm">\n            <thead className="bg-slate-100/80 text-xs uppercase tracking-wide text-slate-500">\n              <tr><th className="text-left px-6 py-3 font-bold">Month</th><th className="text-right px-6 py-3 font-bold">Total Trips</th><th className="text-right px-6 py-3 font-bold">Total Revenue</th><th className="text-right px-6 py-3 font-bold">Net Profit</th></tr>\n            </thead>\n            <tbody className="divide-y divide-slate-100">\n              {monthlyReports.length === 0 ? (\n                <tr><td colSpan={4} className="px-6 py-8 text-center text-slate-500">No monthly business data yet.</td></tr>\n              ) : monthlyReports.map(([month, report]) => {\n                const [year, monthNumber] = month.split("-").map(Number);\n                const label = new Date(year, monthNumber - 1, 1).toLocaleDateString("en-IN", { month: "long", year: "numeric" });\n                const isCurrent = month === currentMonthKey;\n                return (\n                  <tr key={month} className={isCurrent ? "bg-blue-50/50" : "bg-white"}>\n                    <td className="px-6 py-4 font-bold text-slate-800"><div className="flex items-center gap-2"><span>{label}</span>{isCurrent && <span className="text-[10px] font-bold uppercase tracking-wide px-2 py-0.5 rounded-full bg-blue-100 text-blue-700">Current</span>}</div></td>\n                    <td className="px-6 py-4 text-right font-semibold text-slate-700">{report.trips}</td>\n                    <td className="px-6 py-4 text-right font-semibold text-blue-700 font-mono">{formatINR(report.revenue)}</td>\n                    <td className="px-6 py-4 text-right font-bold text-emerald-700 font-mono">{formatINR(report.profit)}</td>\n                  </tr>\n                );\n              })}\n            </tbody>\n          </table>\n        </div>\n      </section>\n\n'''
          if marker not in s: raise SystemExit('Monthly report marker not found')
          s = s.replace(marker, report + marker, 1)
          p.write_text(s)
          Path('.github/workflows/monthly-business-summary-once.yml').unlink()
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/HomePage.tsx .github/workflows/monthly-business-summary-once.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Apply monthly business summary'
          git push

# Triggered after the workflow file is present on main.
