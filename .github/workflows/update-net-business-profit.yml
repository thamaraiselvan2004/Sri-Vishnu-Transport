name: Update Net Business Profit With Halting

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update calculation only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/HomePage.tsx')
          s = p.read_text()
          old = '''  const finalProfit = totalTripProfit - totalMaintenanceExpense;'''
          new = '''  const totalHalting = trips.reduce(\n    (sum, t) => sum + (Number(t.loading_halting_fare) || 0) + (Number(t.unloading_halting_fare) || 0),\n    0\n  );\n  const finalProfit = totalTripProfit - totalMaintenanceExpense + totalHalting;'''
          if old not in s:
              raise SystemExit('Expected profit calculation not found; stopping without changes.')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit calculation change and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/HomePage.tsx
          git rm .github/workflows/update-net-business-profit.yml
          git commit -m "Include total halting in net business profit"
          git push

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: Build Vite app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npx vite build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dist
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
