name: Run Report Mileage and Halting Update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-update:
    runs-on: ubuntu-latest
    steps:
      - name: Run update workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run apply-report-mileage-halting.yml --repo "${{ github.repository }}" --ref main
