name: Apply Final Halting UI
on:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply source patch
        run: python scripts/patch_halting_ui.py
      - name: Build application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm install
          npm run build
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/AddTripPage.tsx src/components/EditTripModal.tsx src/components/DriverReportPage.tsx src/components/HaltingDetailsModal.tsx src/lib/calculations.ts
          git commit -m 'Add loading and unloading halting details'
          git push
      - name: Remove temporary workflows and patch script
        if: always()
        run: |
          git rm -f .github/workflows/apply-final-halting-ui.yml .github/workflows/inspect-halting.yml .github/workflows/apply-halting-report-ui.yml scripts/patch_halting_ui.py 2>/dev/null || true
          git commit -m 'Remove temporary halting patch files' || true
          git push || true
