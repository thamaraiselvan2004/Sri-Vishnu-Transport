name: Apply Final Halting UI

on:
  workflow_dispatch:

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply source patch
        run: python scripts/patch_halting_ui.py

      - name: Install dependencies
        run: npm install

      - name: Build application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Commit patched source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/AddTripPage.tsx src/components/EditTripModal.tsx src/components/DriverReportPage.tsx src/components/HaltingDetailsModal.tsx src/lib/calculations.ts
          git commit -m 'Complete loading and unloading halting UI'
          git push
