name: Restore Driver Report Now

on:
  push:
    branches:
      - main

jobs:
  restore:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, 'Restore Driver Report to original pre-financial version')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact known-good Driver Report files
        run: |
          git checkout 15aa787e02e15bad082888ca000b73ec6f4c43d4 -- src/components/DriverReportPage.tsx src/lib/calculations.ts src/types.ts

      - name: Install dependencies
        run: npm install

      - name: Build application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Commit restored Driver Report files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/DriverReportPage.tsx src/lib/calculations.ts src/types.ts
          git diff --cached --quiet && echo 'Driver Report files already match known-good version' || git commit -m 'Restore Driver Report to original pre-financial version'
          git push
