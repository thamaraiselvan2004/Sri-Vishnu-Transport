name: Apply Mileage Status

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Mileage Status source integration
        run: python scripts/apply-mileage-status.py

      - name: Install dependencies
        run: npm install

      - name: Build application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Commit integration changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/database.ts src/App.tsx supabase_schema.sql scripts/apply-mileage-status.py .github/workflows/apply-mileage-status.yml
          git diff --cached --quiet && echo 'No source changes to commit' || git commit -m 'Mileage Status integration applied'
          git push
