name: Apply Mileage Status

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  apply:
    if: github.event_name == "workflow_dispatch" || !contains(github.event.head_commit.message, "Mileage Status integration applied")
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Mileage Status type import
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/database.ts')
          text = p.read_text()
          old = 'import { Vehicle, Driver, Trip, MaintenanceRecord, ManualMileageRecord } from "../types";'
          new = 'import { Vehicle, Driver, Trip, MaintenanceRecord, ManualMileageRecord, MileageStatusRecord } from "../types";'
          if new not in text:
              if old not in text:
                  raise SystemExit('database.ts import line not found')
              p.write_text(text.replace(old, new, 1))
          PY

      - name: Apply Mileage Status source integration
        run: python scripts/apply-mileage-status.py

      - name: Install dependencies
        run: npm install

      - name: Type-check application
        run: npm run lint

      - name: Build application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Commit integration changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/database.ts src/App.tsx supabase_schema.sql scripts/apply-mileage-status.py .github/workflows/apply-mileage-status.yml
          git diff --cached --quiet && echo 'No source changes to commit' || git commit -m 'Mileage Status integration applied'
          git push

      - name: Record verified build
        run: |
          printf 'Mileage Status integration passed npm run lint and npm run build on %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > MILEAGE_STATUS_BUILD_VERIFIED.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MILEAGE_STATUS_BUILD_VERIFIED.md
          git diff --cached --quiet || git commit -m 'Mileage Status build verified'
          git push
