name: Remove duplicate Add Trip back button

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  fix-and-deploy:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Remove duplicate Add Trip back button')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Remove Back to Home button from Add Trip
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/AddTripPage.tsx')
          text = p.read_text()
          block = '''        <button
          onClick={onNavigateHome}
          className="inline-flex items-center gap-2 text-sm font-semibold text-slate-600 hover:text-slate-900 transition"
        >
          <ArrowLeft className="w-4 h-4" />
          <span>Back to Home</span>
        </button>

'''
          if block not in text:
              raise SystemExit('Back to Home button block not found')
          p.write_text(text.replace(block, '', 1))
          text = p.read_text()
          text = text.replace('  ArrowLeft,\n', '')
          p.write_text(text)
          PY

      - name: Install dependencies
        run: npm install

      - name: Build application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npx vite build

      - name: Deploy to GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Remove one-time workflow
        run: |
          rm -f .github/workflows/remove-add-trip-back-button.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/AddTripPage.tsx .github/workflows/remove-add-trip-back-button.yml
          git commit -m 'Remove duplicate Add Trip back button'
          git push
