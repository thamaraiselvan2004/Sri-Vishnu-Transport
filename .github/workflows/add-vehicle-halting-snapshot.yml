name: Add Vehicle Halting Snapshot Metrics

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-vehicle-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Restore clean Vehicle Report and add requested metrics
        run: |
          set -e
          curl -fsSL "https://raw.githubusercontent.com/thamaraiselvan2004/Sri-Vishnu-Transport/15aa787e02e15bad082888ca000b73ec6f4c43d4/src/components/VehicleReportPage.tsx" -o src/components/VehicleReportPage.tsx
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/VehicleReportPage.tsx')
          s=p.read_text()
          marker='''  const insights = useMemo(() => {'''
          calc='''  const totalHaltingDays = useMemo(() => vehicleTrips.reduce((total, trip) => {
    const separate = trip.loading_halting_days !== undefined || trip.unloading_halting_days !== undefined;
    return total + (separate ? (Number(trip.loading_halting_days) || 0) + (Number(trip.unloading_halting_days) || 0) : (Number(trip.halting_days) || 0));
  }, 0), [vehicleTrips]);

  const totalHaltingCharges = useMemo(() => vehicleTrips.reduce((total, trip) => {
    const separate = trip.loading_halting_fare !== undefined || trip.unloading_halting_fare !== undefined;
    return total + (separate ? (Number(trip.loading_halting_fare) || 0) + (Number(trip.unloading_halting_fare) || 0) : (Number(trip.halting_fare) || 0));
  }, 0), [vehicleTrips]);

  const overallProfit = stats.finalVehicleProfit + totalHaltingCharges;

'''
          if marker not in s: raise SystemExit('stats marker missing')
          s=s.replace(marker,calc+marker,1)
          service='''          {/* Card 9: Service Maintenance */}'''
          start=s.index(service)
          # Find end of snapshot grid by locating tabs after Card 9.
          tabs='''      {/* Tabs Navigation for Report Sections */}'''
          end=s.index(tabs,start)
          block=s[start:end]
          if 'Card 10: Total Halting Days' not in block:
            cards='''
          {/* Card 10: Total Halting Days */}
          <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs">
            <div className="text-xs font-bold text-slate-500 uppercase tracking-wide flex items-center gap-1"><Clock className="w-3.5 h-3.5 text-violet-600" /><span>Total Halting Days</span></div>
            <div className="text-2xl sm:text-3xl font-black font-mono text-violet-700 mt-1">{totalHaltingDays} Days</div>
            <div className="text-xs text-slate-500 mt-1">Loading + Unloading halting</div>
          </div>

          {/* Card 11: Total Halting Charges */}
          <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs">
            <div className="text-xs font-bold text-slate-500 uppercase tracking-wide flex items-center gap-1"><IndianRupee className="w-3.5 h-3.5 text-rose-600" /><span>Total Halting Charges</span></div>
            <div className="text-2xl sm:text-3xl font-black font-mono text-rose-700 mt-1">{formatINR(totalHaltingCharges)}</div>
            <div className="text-xs text-slate-500 mt-1">Total loading + unloading halting</div>
          </div>

          {/* Card 12: Overall Profit */}
          <div className="bg-white p-5 rounded-2xl border-2 border-violet-500/80 shadow-xs bg-violet-50/20">
            <div className="text-xs font-bold text-violet-800 uppercase tracking-wide">Overall Profit</div>
            <div className={`text-2xl sm:text-3xl font-black font-mono mt-1 ${overallProfit >= 0 ? "text-violet-700" : "text-red-700"}`}>{formatINR(overallProfit)}</div>
            <div className="text-xs text-violet-700 font-semibold mt-1">Final Net Profit + Total Halting Charges</div>
          </div>
'''
            s=s[:end]+cards+s[end:]
          p.write_text(s)
          PY

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npx vite build

      - name: Commit source change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/VehicleReportPage.tsx
          git commit -m 'Add vehicle halting snapshot metrics'
          git push
