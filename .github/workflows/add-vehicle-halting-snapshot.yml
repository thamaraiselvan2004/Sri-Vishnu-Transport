name: Add Vehicle Halting Snapshot Metrics

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-vehicle-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fix Vehicle Report
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/VehicleReportPage.tsx')
          text = path.read_text(encoding='utf-8')

          # Close Service Maintenance card before Card 10.
          bad = '''            </div>\n\n          {/* Card 10: Total Halting Days */}'''
          good = '''            </div>\n          </div>\n\n          {/* Card 10: Total Halting Days */}'''
          if bad in text:
              text = text.replace(bad, good, 1)

          path.write_text(text, encoding='utf-8')
          print('Vehicle Report structure fixed.')
          PY

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npx vite build

      - name: Commit Vehicle Report change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/VehicleReportPage.tsx
          if git diff --cached --quiet; then
            echo 'No Vehicle Report changes needed.'
            exit 0
          fi
          git commit -m 'Fix vehicle halting snapshot layout'
          git push
