name: Fix Separate Halting UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch halting UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Add Trip: preserve existing total calculation but expose separate loading/unloading inputs.
          p=Path('src/components/AddTripPage.tsx'); s=p.read_text()
          s=s.replace('const [haltingDays, setHaltingDays] = useState<string>("0");\n  const [haltingChargePerDay, setHaltingChargePerDay] = useState<string>("0");', 'const [loadingHaltingDays, setLoadingHaltingDays] = useState<string>("0");\n  const [loadingHaltingChargePerDay, setLoadingHaltingChargePerDay] = useState<string>("0");\n  const [unloadingHaltingDays, setUnloadingHaltingDays] = useState<string>("0");\n  const [unloadingHaltingChargePerDay, setUnloadingHaltingChargePerDay] = useState<string>("0");')
          s=s.replace('const numHaltingDays = parseFloat(haltingDays) || 0;\n  const numHaltingChargePerDay = parseFloat(haltingChargePerDay) || 0;\n  const haltingFare = numHaltingDays * numHaltingChargePerDay;', 'const numLoadingHaltingDays = parseFloat(loadingHaltingDays) || 0;\n  const numLoadingHaltingChargePerDay = parseFloat(loadingHaltingChargePerDay) || 0;\n  const loadingHaltingFare = numLoadingHaltingDays * numLoadingHaltingChargePerDay;\n  const numUnloadingHaltingDays = parseFloat(unloadingHaltingDays) || 0;\n  const numUnloadingHaltingChargePerDay = parseFloat(unloadingHaltingChargePerDay) || 0;\n  const unloadingHaltingFare = numUnloadingHaltingDays * numUnloadingHaltingChargePerDay;\n  const numHaltingDays = numLoadingHaltingDays + numUnloadingHaltingDays;\n  const numHaltingChargePerDay = numHaltingDays > 0 ? (loadingHaltingFare + unloadingHaltingFare) / numHaltingDays : 0;\n  const haltingFare = loadingHaltingFare + unloadingHaltingFare;')
          s=s.replace('halting_fare: haltingFare,', 'halting_fare: haltingFare,\n        loading_halting_days: numLoadingHaltingDays,\n        loading_halting_charge_per_day: numLoadingHaltingChargePerDay,\n        loading_halting_fare: loadingHaltingFare,\n        unloading_halting_days: numUnloadingHaltingDays,\n        unloading_halting_charge_per_day: numUnloadingHaltingChargePerDay,\n        unloading_halting_fare: unloadingHaltingFare,')
          pattern=r'(<div className="grid grid-cols-1 sm:grid-cols-3 gap-4 items-end">).*?(</div>\s*\{\/\* Advance & Balance Details \*\/\})'
          replacement='''<div className="grid grid-cols-1 md:grid-cols-2 gap-4">\n              <div className="rounded-2xl border border-blue-200 bg-blue-50/50 p-4">\n                <h3 className="text-sm font-bold text-blue-800 mb-3">Loading Halting</h3>\n                <div className="grid grid-cols-3 gap-3">\n                  <input aria-label="Loading halting days" type="number" min="0" step="any" value={loadingHaltingDays} onChange={(e)=>setLoadingHaltingDays(e.target.value)} placeholder="Days" className="px-3 py-2 rounded-xl border border-slate-300" />\n                  <input aria-label="Loading halting charge per day" type="number" min="0" step="any" value={loadingHaltingChargePerDay} onChange={(e)=>setLoadingHaltingChargePerDay(e.target.value)} placeholder="Charge / day" className="px-3 py-2 rounded-xl border border-slate-300" />\n                  <div className="px-3 py-2 rounded-xl bg-white border border-blue-200 font-mono font-bold">₹{loadingHaltingFare.toFixed(2)}</div>\n                </div>\n              </div>\n              <div className="rounded-2xl border border-orange-200 bg-orange-50/50 p-4">\n                <h3 className="text-sm font-bold text-orange-800 mb-3">Unloading Halting</h3>\n                <div className="grid grid-cols-3 gap-3">\n                  <input aria-label="Unloading halting days" type="number" min="0" step="any" value={unloadingHaltingDays} onChange={(e)=>setUnloadingHaltingDays(e.target.value)} placeholder="Days" className="px-3 py-2 rounded-xl border border-slate-300" />\n                  <input aria-label="Unloading halting charge per day" type="number" min="0" step="any" value={unloadingHaltingChargePerDay} onChange={(e)=>setUnloadingHaltingChargePerDay(e.target.value)} placeholder="Charge / day" className="px-3 py-2 rounded-xl border border-slate-300" />\n                  <div className="px-3 py-2 rounded-xl bg-white border border-orange-200 font-mono font-bold">₹{unloadingHaltingFare.toFixed(2)}</div>\n                </div>\n              </div>\n            </div>\n            <div className="text-xs font-semibold text-slate-500">Total Halting: {numHaltingDays} days · ₹{haltingFare.toFixed(2)}</div>\n\n          {/* Advance & Balance Details */}'''
          s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          print('AddTrip halting UI replacements:',n)
          p.write_text(s)

          # Driver report: make overall halting days clickable and show trip-level loading/unloading detail.
          p=Path('src/components/DriverReportPage.tsx'); s=p.read_text()
          if 'const [showHaltingTrips' not in s:
              s=s.replace('const [inspectingTrip, setInspectingTrip] = useState<Trip | null>(null);','const [inspectingTrip, setInspectingTrip] = useState<Trip | null>(null);\n  const [showHaltingTrips, setShowHaltingTrips] = useState(false);')
          old='''<div className="text-2xl font-black font-mono text-purple-800 mt-2">\n              {stats.overallHaltingDays} Days\n            </div>'''
          new='''<button type="button" onClick={() => setShowHaltingTrips(true)} className="text-left hover:opacity-80 transition">\n              <div className="text-2xl font-black font-mono text-purple-800 mt-2">\n                {stats.overallHaltingDays} Days\n              </div>\n            </button>'''
          s=s.replace(old,new)
          if 'showHaltingTrips &&' not in s:
              modal='''\n      {showHaltingTrips && (\n        <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4" onClick={() => setShowHaltingTrips(false)}>\n          <div className="bg-white rounded-3xl shadow-2xl max-w-3xl w-full max-h-[80vh] overflow-auto p-6" onClick={(e)=>e.stopPropagation()}>\n            <div className="flex items-center justify-between mb-4"><div><h3 className="text-xl font-black">Halting Trips</h3><p className="text-xs text-slate-500">Loading / unloading halting for {selectedDriverName}</p></div><button type="button" onClick={()=>setShowHaltingTrips(false)} className="px-3 py-2 rounded-xl bg-slate-100 font-bold">Close</button></div>\n            <div className="space-y-3">\n              {driverTrips.filter(t => (t.halting_days ?? 0) > 0 || (t.loading_halting_days ?? 0) > 0 || (t.unloading_halting_days ?? 0) > 0).map(t => (\n                <div key={t.id} className="rounded-2xl border border-slate-200 p-4">\n                  <div className="flex justify-between gap-2 font-bold"><span>{formatIndianDate(t.trip_date)}</span><span>{t.vehicle_number || ""}</span></div>\n                  <div className="text-sm text-slate-600 mt-1">{t.from_city} → {t.to_city}</div>\n                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-3">\n                    {(t.loading_halting_days ?? 0) > 0 && <div className="rounded-xl bg-blue-50 p-3 text-sm"><div className="font-bold text-blue-800">Loading Halting</div>{t.loading_halting_days} days × ₹{t.loading_halting_charge_per_day ?? 0} = ₹{t.loading_halting_fare ?? 0}</div>}\n                    {(t.unloading_halting_days ?? 0) > 0 && <div className="rounded-xl bg-orange-50 p-3 text-sm"><div className="font-bold text-orange-800">Unloading Halting</div>{t.unloading_halting_days} days × ₹{t.unloading_halting_charge_per_day ?? 0} = ₹{t.unloading_halting_fare ?? 0}</div>}\n                  </div>\n                </div>\n              ))}\n            </div>\n          </div>\n        </div>\n      )}\n'''
              idx=s.rfind('\n  );\n};')
              if idx!=-1: s=s[:idx]+modal+s[idx:]
          p.write_text(s)
          PY
      - name: TypeScript check
        run: |
          npm install
          npx tsc --noEmit
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --quiet || (git commit -m "Add loading and unloading halting UI and driver details" && git push)
