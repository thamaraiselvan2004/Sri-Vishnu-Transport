name: Update Mileage Status Placement

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update source
        shell: python
        run: |
          from pathlib import Path
          import re

          home = Path('src/components/HomePage.tsx')
          text = home.read_text()

          # Keep only the first Mileage Status home card if duplicate copies exist.
          pattern = re.compile(
              r'\n\s*<div className="md:col-start-3 mt-5">\s*\n'
              r'\s*<MileageStatusHomeCard\s*\n'
              r'\s*onNavigate=\{\(\) => onNavigate\("mileage-status"\)\}\s*\n'
              r'\s*/>\s*\n\s*</div>',
              re.MULTILINE,
          )
          matches = list(pattern.finditer(text))
          if len(matches) > 1:
              for m in reversed(matches[1:]):
                  text = text[:m.start()] + text[m.end():]
              home.write_text(text)

          vehicle = Path('src/components/VehicleReportPage.tsx')
          text = vehicle.read_text()

          if 'import { MileageStatusPage } from "./MileageStatusPage";' not in text:
              text = text.replace(
                  'import { EditTripModal } from "./EditTripModal";\n',
                  'import { EditTripModal } from "./EditTripModal";\nimport { MileageStatusPage } from "./MileageStatusPage";\n',
                  1,
              )

          marker = '      <MileageStatusPage\n'
          if marker not in text:
              needle = '    </div>\n  );\n};\n'
              addition = '''

      {/* Mileage Status — same persistent mileage feature available from Vehicle Report Analysis */}
      <div className="border-t border-slate-200 pt-8">
        <MileageStatusPage
          vehicles={allVehicles}
          onNavigateHome={() => window.scrollTo({ top: 0, behavior: "smooth" })}
        />
      </div>'''
              if needle not in text:
                  raise SystemExit('VehicleReportPage ending marker not found')
              text = text.replace(needle, '    </div>' + addition + '\n  );\n};\n', 1)

          vehicle.write_text(text)

      - name: Build verification
        run: |
          npm install
          npx vite build

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/HomePage.tsx src/components/VehicleReportPage.tsx
          git diff --cached --quiet && echo "No source changes needed" || git commit -m "Fix Mileage Status placement and add to vehicle reports"
          git push

      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/update-mileage-status-placement.yml
          git commit -m "Remove one-time Mileage Status placement workflow"
          git push
