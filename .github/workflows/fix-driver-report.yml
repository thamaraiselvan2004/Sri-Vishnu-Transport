name: Fix Driver Report

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Fix Driver Report')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove halting from Overall Driver Beta and fix duplicate import
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/DriverReportPage.tsx')
          s = p.read_text()
          duplicate = 'import { updateDriverHaltingAmount } from "../lib/database";\nimport { updateDriverHaltingAmount } from "../lib/database";'
          s = s.replace(duplicate, 'import { updateDriverHaltingAmount } from "../lib/database";')
          old = 'const adjustedOverallDriverBeta = (Number(stats.overallDriverBeta) || 0) + overallHaltingAmount;'
          s = s.replace(old, 'const adjustedOverallDriverBeta = Number(stats.overallDriverBeta) || 0;')
          p.write_text(s)
          PY

      - name: Install dependencies
        run: npm install

      - name: Build application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/DriverReportPage.tsx
          git diff --cached --quiet && echo 'No changes needed' || git commit -m 'Fix Driver Report'
          git push
